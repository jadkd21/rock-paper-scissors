<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Rock Paper Scissors</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f3f0e8;
      --paper: #fffdf7;
      --ink: #161512;
      --muted: #665f54;
      --line: #1b1915;
      --accent: #e74b35;
      --accent-ink: #fffaf1;
      --yellow: #f0c94a;
      --blue: #4b83a7;
      --win: #247a4b;
      --lose: #b6322c;
      --draw: #8a6813;
      --shadow: 7px 7px 0 var(--line);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151411;
        --paper: #24211c;
        --ink: #f7f0df;
        --muted: #c4b9a5;
        --line: #f7f0df;
        --accent: #ff624d;
        --accent-ink: #17120e;
        --yellow: #e6bb35;
        --blue: #73a7c5;
        --win: #68c890;
        --lose: #ff786d;
        --draw: #edc85b;
        --shadow: 7px 7px 0 #080807;
      }
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background:
        linear-gradient(var(--bg), var(--bg)),
        repeating-linear-gradient(0deg, transparent 0 27px, color-mix(in srgb, var(--ink) 6%, transparent) 28px);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    button { font: inherit; }
    .game {
      width: min(100%, 980px);
      margin: 0 auto;
      display: grid;
      gap: 26px;
    }

    .scorebar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid var(--line);
      padding: 0 2px 17px;
    }
    .score { display: flex; align-items: baseline; gap: 10px; }
    .score:last-child { justify-content: flex-end; text-align: right; }
    .score strong {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: .8;
      font-weight: 400;
    }
    .score span { color: var(--muted); font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
    .versus {
      width: 44px; height: 44px;
      border: 2px solid var(--line);
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 1.25rem;
      transform: rotate(-5deg);
      background: var(--yellow);
      color: #161512;
    }

    .intro { text-align: center; }
    h1 {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(3.6rem, 9vw, 7.4rem);
      line-height: .86;
      letter-spacing: .01em;
      margin: 12px 0 8px;
    }
    .intro p { color: var(--muted); margin: 0; font-size: clamp(.96rem, 2vw, 1.08rem); }

    .arena {
      display: grid;
      grid-template-columns: 1fr minmax(240px, 1.25fr) 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .fighter, .result-card {
      border: 3px solid var(--line);
      background: var(--paper);
      min-height: 210px;
    }
    .fighter {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .fighter::after {
      content: attr(data-label);
      position: absolute;
      top: 10px;
      left: 12px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .move-glyph {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(2.2rem, 6vw, 4.7rem);
      line-height: 1;
      transform: rotate(-4deg);
    }
    .fighter.computer .move-glyph { transform: rotate(4deg); }
    .move-name { color: var(--muted); font-weight: 700; font-size: .9rem; text-transform: uppercase; letter-spacing: .12em; }
    .waiting .move-glyph { color: var(--muted); opacity: .42; }
    .shuffling .move-glyph { animation: shuffle .18s linear infinite alternate; }

    .result-card {
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 20px;
      box-shadow: var(--shadow);
      transform: translate(-3px, -3px);
    }
    .result-card[data-state="win"] { background: color-mix(in srgb, var(--win) 15%, var(--paper)); }
    .result-card[data-state="lose"] { background: color-mix(in srgb, var(--lose) 14%, var(--paper)); }
    .result-card[data-state="draw"] { background: color-mix(in srgb, var(--yellow) 23%, var(--paper)); }
    .result-title {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(2.3rem, 5vw, 4rem);
      line-height: .9;
      margin: 0 0 11px;
    }
    .result-detail { margin: 0; max-width: 28ch; color: var(--muted); font-size: .92rem; line-height: 1.45; }
    .trash-talk {
      margin: 10px 0 0;
      max-width: 28ch;
      font-weight: 700;
      font-size: .95rem;
      line-height: 1.35;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .choice {
      min-height: 138px;
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      padding: 18px 12px 15px;
      display: grid;
      justify-items: center;
      gap: 8px;
      box-shadow: 5px 5px 0 var(--line);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .choice:nth-child(2) { transform: rotate(-1deg); }
    .choice:nth-child(3) { transform: rotate(1deg); }
    .choice:hover { background: color-mix(in srgb, var(--yellow) 22%, var(--paper)); }
    .choice:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--line); }
    .choice:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
    .choice:disabled { cursor: wait; opacity: .58; }
    .choice svg { width: 56px; height: 56px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .choice strong { font-family: "Bebas Neue", Impact, sans-serif; font-size: 1.55rem; font-weight: 400; letter-spacing: .04em; }
    .choice small { color: var(--muted); font-size: .72rem; font-weight: 600; }

    .footer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      border-top: 2px solid var(--line);
      padding-top: 16px;
    }
    .history-wrap { min-width: 0; }
    .history-label { display: block; color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    .history { display: flex; flex-wrap: wrap; gap: 7px; min-height: 28px; }
    .round-chip { border: 1.5px solid var(--line); padding: 4px 8px; font-size: .72rem; font-weight: 700; background: var(--paper); }
    .round-chip.win { color: var(--win); }
    .round-chip.lose { color: var(--lose); }
    .round-chip.draw { color: var(--draw); }
    .empty-history { color: var(--muted); font-size: .82rem; }
    .actions { display: flex; gap: 9px; }
    .utility {
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 8px 11px;
      font-size: .75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .utility:hover { background: var(--ink); color: var(--bg); }
    .utility:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .flash { animation: pop .32s cubic-bezier(.2,.8,.2,1); }
    @keyframes pop { 0% { transform: scale(.94) rotate(-1deg); } 55% { transform: scale(1.03) rotate(1deg); } 100% { transform: scale(1); } }
    @keyframes shuffle { from { transform: translateY(-4px) rotate(-6deg); } to { transform: translateY(4px) rotate(6deg); } }

    @media (max-width: 700px) {
      body { padding-left: 14px; padding-right: 14px; }
      .game { gap: 20px; }
      .arena { grid-template-columns: 1fr 1fr; gap: 11px; }
      .fighter { min-height: 140px; }
      .result-card { grid-column: 1 / -1; grid-row: 2; min-height: 145px; padding: 22px 18px; box-shadow: 5px 5px 0 var(--line); }
      .choices { gap: 9px; }
      .choice { min-height: 120px; padding: 14px 6px 12px; box-shadow: 4px 4px 0 var(--line); }
      .choice svg { width: 44px; height: 44px; }
      .choice small { display: none; }
      .footer-row { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
    }

    @media (max-width: 380px) {
      h1 { font-size: 3.15rem; }
      .score span { font-size: .68rem; letter-spacing: .08em; }
      .score strong { font-size: 2.35rem; }
      .versus { width: 38px; height: 38px; }
      .choice strong { font-size: 1.25rem; }
      .choice { min-height: 106px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-live="polite">
    <section class="scorebar" aria-label="Score">
      <div class="score"><strong id="playerScore">0</strong><span>You</span></div>
      <div class="versus" aria-hidden="true">VS</div>
      <div class="score"><span>CPU</span><strong id="computerScore">0</strong></div>
    </section>

    <header class="intro">
      <h1>Pick your move.</h1>
      <p>First to outsmart the machine earns bragging rights.</p>
    </header>

    <section class="arena" aria-label="Current round">
      <div class="fighter waiting" id="playerFighter" data-label="Your move">
        <div class="move-glyph" id="playerGlyph" aria-hidden="true">—</div>
        <div class="move-name" id="playerMove">Waiting</div>
      </div>

      <div class="result-card" id="resultCard" data-state="ready">
        <h2 class="result-title" id="resultTitle">Ready?</h2>
        <p class="result-detail" id="resultDetail">Choose rock, paper, or scissors below.</p>
        <p class="trash-talk" id="trashTalk" hidden></p>
      </div>

      <div class="fighter computer waiting" id="computerFighter" data-label="Computer">
        <div class="move-glyph" id="computerGlyph" aria-hidden="true">?</div>
        <div class="move-name" id="computerMove">Hidden</div>
      </div>
    </section>

    <section class="choices" aria-label="Choose your move">
      <button class="choice" type="button" data-move="rock" aria-label="Choose rock">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 43 11 32l8-14 10-5 12 3 10 11-1 16-10 9H24Z"/><path d="m18 26 9 2 6-10 8 7 10 2M20 44l10-9 13 2"/></svg>
        <strong>Rock</strong><small>Crushes scissors</small>
      </button>
      <button class="choice" type="button" data-move="paper" aria-label="Choose paper">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 8h24l8 8v40H17Z"/><path d="M41 8v10h8M24 28h18M24 36h18M24 44h12"/></svg>
        <strong>Paper</strong><small>Covers rock</small>
      </button>
      <button class="choice" type="button" data-move="scissors" aria-label="Choose scissors">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="17" cy="45" r="8"/><circle cx="39" cy="45" r="8"/><path d="m22 39 27-25M34 39 14 14M37 25l12 14"/></svg>
        <strong>Scissors</strong><small>Cuts paper</small>
      </button>
    </section>

    <section class="footer-row">
      <div class="history-wrap">
        <span class="history-label">Last five rounds</span>
        <div class="history" id="history"><span class="empty-history">No rounds played yet.</span></div>
      </div>
      <div class="actions">
        <button class="utility" id="soundBtn" type="button" aria-label="Toggle trash talk voice" aria-pressed="true">Voice on</button>
        <button class="utility" id="resetBtn" type="button">Reset score</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var moves = ["rock", "paper", "scissors"];
      var beats = { rock: "scissors", paper: "rock", scissors: "paper" };
      var glyphs = { rock: "ROCK", paper: "PAPER", scissors: "SNIP" };
      var wins = [
        { text: "Enjoy that win. I was calibrating." },
        { text: "Okay, that was almost impressive." },
        { text: "Lucky guess, human. Don't get comfortable." },
        { text: "You got me. Once." }
      ];
      var losses = [
        { text: "I saw that move coming from a mile away." },
        { text: "Outplayed by a random number. Ouch." },
        { text: "Was that your strategy? Adorable." },
        { text: "The toaster just beat you." }
      ];
      var draws = [
        { text: "Copycat. Pick your own move." },
        { text: "Same move? Stay out of my circuits." },
        { text: "A draw. Even by accident, you keep up." },
        { text: "Nobody wins. Especially not you." }
      ];
      var score = { player: 0, computer: 0 };
      var rounds = [];
      var locked = false;
      var soundOn = true;
      var currentLine = null;
      var currentUtterance = null;
      var voiceNeedsUnlock = false;
      var synth = window.speechSynthesis || null;
      var preferredVoice = null;

      var playerScore = document.getElementById("playerScore");
      var computerScore = document.getElementById("computerScore");
      var playerFighter = document.getElementById("playerFighter");
      var computerFighter = document.getElementById("computerFighter");
      var playerGlyph = document.getElementById("playerGlyph");
      var computerGlyph = document.getElementById("computerGlyph");
      var playerMove = document.getElementById("playerMove");
      var computerMove = document.getElementById("computerMove");
      var resultCard = document.getElementById("resultCard");
      var resultTitle = document.getElementById("resultTitle");
      var resultDetail = document.getElementById("resultDetail");
      var trashTalk = document.getElementById("trashTalk");
      var historyEl = document.getElementById("history");
      var choiceButtons = Array.prototype.slice.call(document.querySelectorAll(".choice"));
      var soundBtn = document.getElementById("soundBtn");

      function randomLine(list) { return list[Math.floor(Math.random() * list.length)]; }
      function titleCase(value) { return value.charAt(0).toUpperCase() + value.slice(1); }

      function chooseVoice() {
        if (!synth) return;
        var voices = synth.getVoices();
        preferredVoice = voices.find(function (voice) {
          return voice.lang && voice.lang.toLowerCase().indexOf("en-us") === 0;
        }) || voices.find(function (voice) {
          return voice.lang && voice.lang.toLowerCase().indexOf("en") === 0;
        }) || null;
      }

      chooseVoice();
      if (synth && typeof synth.addEventListener === "function") {
        synth.addEventListener("voiceschanged", chooseVoice);
      }

      function speak(line) {
        currentLine = line;
        if (!soundOn) return;

        if (!synth || typeof window.SpeechSynthesisUtterance !== "function") {
          voiceNeedsUnlock = true;
          soundBtn.textContent = "Voice unavailable";
          soundBtn.setAttribute("aria-pressed", "false");
          return;
        }

        if (synth.speaking || synth.pending) synth.cancel();
        synth.resume();

        var utterance = new SpeechSynthesisUtterance(line.text);
        utterance.lang = "en-US";
        utterance.rate = 1;
        utterance.pitch = 0.82;
        utterance.volume = 1;
        if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onstart = function () {
          voiceNeedsUnlock = false;
          soundBtn.textContent = "Voice on";
          soundBtn.setAttribute("aria-pressed", "true");
        };
        utterance.onerror = function (event) {
          if (event.error === "canceled" || event.error === "interrupted") return;
          voiceNeedsUnlock = true;
          soundBtn.textContent = "Tap to try voice";
          soundBtn.setAttribute("aria-pressed", "false");
        };
        utterance.onend = function () {
          if (currentUtterance === utterance) currentUtterance = null;
        };

        currentUtterance = utterance;
        synth.speak(utterance);
      }

      function getOutcome(player, computer) {
        if (player === computer) return "draw";
        return beats[player] === computer ? "win" : "lose";
      }

      function renderHistory() {
        historyEl.innerHTML = "";
        if (!rounds.length) {
          var empty = document.createElement("span");
          empty.className = "empty-history";
          empty.textContent = "No rounds played yet.";
          historyEl.appendChild(empty);
          return;
        }
        rounds.slice(-5).reverse().forEach(function (round) {
          var chip = document.createElement("span");
          chip.className = "round-chip " + round.outcome;
          chip.textContent = titleCase(round.player) + " · " + (round.outcome === "win" ? "W" : round.outcome === "lose" ? "L" : "D");
          chip.title = "You chose " + round.player + "; computer chose " + round.computer;
          historyEl.appendChild(chip);
        });
      }

      function play(player) {
        if (locked) return;
        locked = true;
        choiceButtons.forEach(function (button) { button.disabled = true; });

        var computer = moves[Math.floor(Math.random() * moves.length)];
        var outcome = getOutcome(player, computer);
        var line = outcome === "win" ? randomLine(wins) : outcome === "lose" ? randomLine(losses) : randomLine(draws);

        /* Start playback inside the tap handler so phone browsers allow it. */
        speak(line);

        playerFighter.classList.remove("waiting");
        playerGlyph.textContent = glyphs[player];
        playerMove.textContent = titleCase(player);
        computerFighter.classList.remove("waiting");
        computerFighter.classList.add("shuffling");
        computerGlyph.textContent = "?";
        computerMove.textContent = "Thinking";
        resultCard.dataset.state = "ready";
        resultTitle.textContent = "Rock. Paper. Scissors…";
        resultDetail.textContent = "The machine is making its move.";
        trashTalk.hidden = true;
        trashTalk.textContent = "";

        window.setTimeout(function () {
          computerFighter.classList.remove("shuffling");
          computerGlyph.textContent = glyphs[computer];
          computerMove.textContent = titleCase(computer);

          if (outcome === "win") {
            score.player += 1;
            resultTitle.textContent = "You win!";
            resultDetail.textContent = titleCase(player) + " beats " + computer + ".";
          } else if (outcome === "lose") {
            score.computer += 1;
            resultTitle.textContent = "CPU wins";
            resultDetail.textContent = titleCase(computer) + " beats " + player + ".";
          } else {
            resultTitle.textContent = "It's a draw";
            resultDetail.textContent = "You both picked " + player + ".";
          }

          trashTalk.textContent = "“" + line.text + "”";
          trashTalk.hidden = false;

          playerScore.textContent = String(score.player);
          computerScore.textContent = String(score.computer);
          resultCard.dataset.state = outcome;
          resultCard.classList.remove("flash");
          void resultCard.offsetWidth;
          resultCard.classList.add("flash");
          rounds.push({ player: player, computer: computer, outcome: outcome });
          renderHistory();
          choiceButtons.forEach(function (button) { button.disabled = false; });
          locked = false;
        }, 260);
      }

      choiceButtons.forEach(function (button) {
        button.addEventListener("click", function () { play(button.dataset.move); });
      });

      soundBtn.addEventListener("click", function () {
        if (voiceNeedsUnlock) {
          soundOn = true;
          voiceNeedsUnlock = false;
          speak(currentLine || { text: "Voice is on. Pick a move." });
          return;
        }

        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? "Voice on" : "Voice off";
        soundBtn.setAttribute("aria-pressed", String(soundOn));
        if (!soundOn) {
          if (synth) synth.cancel();
          currentUtterance = null;
        } else {
          speak(currentLine || { text: "Voice is on. Pick a move." });
        }
      });

      document.getElementById("resetBtn").addEventListener("click", function () {
        score.player = 0;
        score.computer = 0;
        rounds = [];
        playerScore.textContent = "0";
        computerScore.textContent = "0";
        playerFighter.classList.add("waiting");
        computerFighter.classList.add("waiting");
        playerGlyph.textContent = "—";
        computerGlyph.textContent = "?";
        playerMove.textContent = "Waiting";
        computerMove.textContent = "Hidden";
        resultCard.dataset.state = "ready";
        resultTitle.textContent = "Ready?";
        resultDetail.textContent = "Choose rock, paper, or scissors below.";
        trashTalk.hidden = true;
        trashTalk.textContent = "";
        if (synth) synth.cancel();
        currentUtterance = null;
        renderHistory();
      });
    })();
  </script>
</body>
</html>
